schema_version: 1
experiment_id: frequency-validation-8-15-square
title: Monitor Frequency Validation 8-15 Hz with Distractors (Square)
random_seed: 20260801
device_profile: ../../devices/synthetic.yaml

protocol: &sweep_protocol
  active_stimulus_id: freq-8
  stimulus_sequence: [freq-8, freq-9, freq-10, freq-11, freq-12, freq-13, freq-14, freq-15]
  simultaneous_stimulus_ids: [distractor-8-25, distractor-11-25, distractor-14-25]
  randomize_stimulus_sequence: false
  repetitions: 2
  acquisition_pre_roll_seconds: 0.0
  initial_rest_seconds: 3.0
  pre_stimulus_seconds: 1.0
  stimulation_seconds: 10.0
  inter_trial_seconds: 2.0
  sequence_break_seconds: 0.0
  final_rest_seconds: 1.0
  acquisition_post_roll_seconds: 0.0

stimuli:
  - id: freq-8
    frequency_hz: 8.0
    phase_offset_radians: 0.0
    duty_cycle: 0.5
    waveform: square
    visual: &validation_visual
      shape: rectangle
      width_px: 400
      height_px: 400
      center_x: 1.0
      center_y: 1.0
      anchor: bottom_right
      on_color: "#FFFFFF"
      off_color: "#000000"
  - {id: freq-9, frequency_hz: 9.0, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: *validation_visual}
  - {id: freq-10, frequency_hz: 10.0, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: *validation_visual}
  - {id: freq-11, frequency_hz: 11.0, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: *validation_visual}
  - {id: freq-12, frequency_hz: 12.0, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: *validation_visual}
  - {id: freq-13, frequency_hz: 13.0, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: *validation_visual}
  - {id: freq-14, frequency_hz: 14.0, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: *validation_visual}
  - {id: freq-15, frequency_hz: 15.0, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: *validation_visual}
  - {id: distractor-8-25, frequency_hz: 8.25, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: {shape: rectangle, width_px: 400, height_px: 400, center_x: 0.15, center_y: 0.25, on_color: "#FFFFFF", off_color: "#000000"}}
  - {id: distractor-11-25, frequency_hz: 11.25, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: {shape: rectangle, width_px: 400, height_px: 400, center_x: 0.45, center_y: 0.25, on_color: "#FFFFFF", off_color: "#000000"}}
  - {id: distractor-14-25, frequency_hz: 14.25, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: {shape: rectangle, width_px: 400, height_px: 400, center_x: 0.75, center_y: 0.25, on_color: "#FFFFFF", off_color: "#000000"}}

presentation: &sweep_presentation
  window_mode: full_screen
  screen_index: 0
  background_color: "#000000"
  hide_cursor: true
  show_trial_progress: true
  trial_progress_message: "Square-wave load test {current} of {total}"
  refresh_preflight_frames: 120
  require_timing_quality: true
  max_frequency_error_hz: 0.25
  max_dropped_frame_fraction: 0.02
  psychopy:
    monitor_name: SSVEP_60Hz
    gamma: 1.0
    refresh_rate_hz: 60.0
    use_retina: false
    allow_gui: false
    check_timing: true
    units: pix
    interpolate: false
    message_color: "#808080"
    message_height_px: 40
    cue_border_color: "#FF3040"
    cue_border_width_px: 8

output: {root_dir: ../../../../../sessions, flush_every_batch: true, write_checksums: true}
markers: {session_start: 10, session_complete: 11, session_abort: 12, session_failed: 13, trial_start: 20, trial_end: 21, stimulus_onset_base: 1000, stimulus_offset_base: 2000}
resources: {assets: {}}
