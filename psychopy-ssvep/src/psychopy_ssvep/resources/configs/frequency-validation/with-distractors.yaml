schema_version: 1
experiment_id: frequency-validation-with-distractors
title: Monitor Frequency Validation with Distractors
random_seed: 20260801
device_profile: ../../devices/synthetic.yaml
protocol:
  active_stimulus_id: measured-12-75
  simultaneous_stimulus_ids: [distractor-8-25, distractor-9-75, distractor-14-25, measured-12-75]
  repetitions: 2
  acquisition_pre_roll_seconds: 0.0
  initial_rest_seconds: 3.0
  pre_stimulus_seconds: 1.0
  stimulation_seconds: 10.0
  inter_trial_seconds: 2.0
  sequence_break_seconds: 0.0
  final_rest_seconds: 1.0
  acquisition_post_roll_seconds: 0.0
stimuli:
  - {id: distractor-8-25, frequency_hz: 8.25, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: {shape: rectangle, width_px: 400, height_px: 400, center_x: 0.2, center_y: 0.25, on_color: "#FFFFFF", off_color: "#000000"}}
  - {id: distractor-9-75, frequency_hz: 9.75, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: {shape: rectangle, width_px: 400, height_px: 400, center_x: 0.5, center_y: 0.25, on_color: "#FFFFFF", off_color: "#000000"}}
  - {id: distractor-14-25, frequency_hz: 14.25, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: {shape: rectangle, width_px: 400, height_px: 400, center_x: 0.8, center_y: 0.25, on_color: "#FFFFFF", off_color: "#000000"}}
  - {id: measured-12-75, frequency_hz: 12.75, phase_offset_radians: 0.0, duty_cycle: 0.5, waveform: square, visual: {shape: rectangle, width_px: 400, height_px: 400, center_x: 1.0, center_y: 1.0, anchor: bottom_right, on_color: "#FFFFFF", off_color: "#000000"}}
presentation:
  window_mode: full_screen
  screen_index: 0
  background_color: "#000000"
  hide_cursor: true
  show_trial_progress: true
  trial_progress_message: "Distractor load check {current} of {total}"
  refresh_preflight_frames: 120
  require_timing_quality: true
  max_frequency_error_hz: 0.25
  max_dropped_frame_fraction: 0.02
  psychopy: {monitor_name: SSVEP_60Hz, gamma: 1.0, refresh_rate_hz: 60.0, use_retina: false, allow_gui: false, check_timing: true, units: pix, interpolate: false, message_color: "#808080", message_height_px: 40, cue_border_color: "#FF3040", cue_border_width_px: 8}
output: {root_dir: ../../../../../sessions, flush_every_batch: true, write_checksums: true}
markers: {session_start: 10, session_complete: 11, session_abort: 12, session_failed: 13, trial_start: 20, trial_end: 21, stimulus_onset_base: 1000, stimulus_offset_base: 2000}
resources: {assets: {}}
