schema_version: 1
experiment_id: three-frequency-simultaneous
title: Three-Frequency Simultaneous-Squares Collection
random_seed: 20260728
device_profile: ../devices/cyton.yaml

# Three 200 px squares flash simultaneously at their own frequencies (8.75,
# 11.75, and 13.75 Hz) on every trial. The attended target cycles through the
# sequence; each trial is cued with a red border around the target before all
# three squares start flashing. 5 repetitions of the 3-target cycle produce 15
# four-second presentations.
protocol:
  active_stimulus_id: freq-11-75
  stimulus_sequence: [freq-8-75, freq-11-75, freq-13-75]
  simultaneous_stimulus_ids: [freq-8-75, freq-11-75, freq-13-75]
  randomize_stimulus_sequence: false
  repetitions: 5
  acquisition_pre_roll_seconds: 1.0
  initial_rest_seconds: 3.0
  pre_stimulus_seconds: 1.0
  stimulation_seconds: 4.0
  inter_trial_seconds: 2.0
  sequence_break_seconds: 0.0
  final_rest_seconds: 1.0
  acquisition_post_roll_seconds: 1.0

stimuli:
  - id: freq-8-75
    frequency_hz: 8.75
    phase_offset_radians: 0.0
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.25
      center_y: 0.5
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-11-75
    frequency_hz: 11.75
    phase_offset_radians: 0.0
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.5
      center_y: 0.5
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-13-75
    frequency_hz: 13.75
    phase_offset_radians: 0.0
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.75
      center_y: 0.5
      on_color: "#FFFFFF"
      off_color: "#000000"

presentation:
  window_mode: full_screen
  screen_index: 0
  background_color: "#000000"
  hide_cursor: true
  refresh_preflight_frames: 120
  require_timing_quality: true
  max_frequency_error_hz: 0.25
  max_dropped_frame_fraction: 0.02
  psychopy:
    monitor_name: SSVEP_60Hz
    gamma: 2.2
    refresh_rate_hz: 60.0
    use_retina: false
    allow_gui: false
    check_timing: true
    units: pix
    message_color: "#808080"
    message_height_px: 40
    cue_border_color: "#FF3040"
    cue_border_width_px: 8

output:
  root_dir: sessions
  flush_every_batch: true
  write_checksums: true

markers:
  session_start: 10
  session_complete: 11
  session_abort: 12
  session_failed: 13
  trial_start: 20
  trial_end: 21
  stimulus_onset_base: 1000
  stimulus_offset_base: 2000

resources: { assets: {} }
