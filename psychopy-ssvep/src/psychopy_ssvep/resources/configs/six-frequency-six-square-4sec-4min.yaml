schema_version: 1
experiment_id: six-frequency-six-square-4sec-12blocks
title: Six-Frequency Six-Square Target and Five-Distractor Collection
random_seed: 20260729
device_profile: ../devices/synthetic.yaml

# Every block contains six trials so the 13.75 Hz target occupies each grid
# position exactly once. All five distractors are present on every trial.
# Eight blocks yield 48 trials of target-attended stimulation.
protocol:
  active_stimulus_id: freq-8-75
  repetitions: 8
  acquisition_pre_roll_seconds: 0.0
  initial_rest_seconds: 3.0
  pre_stimulus_seconds: 1.0
  stimulation_seconds: 4.0
  inter_trial_seconds: 3.0
  sequence_break_seconds: 0.0
  final_rest_seconds: 0.0
  acquisition_post_roll_seconds: 0.0

multi_stimulus:
  target_stimulus_id: freq-8-75
  distractor_stimulus_ids:
    [freq-9-75, freq-10-75, freq-11-75, freq-12-75, freq-13-75]
  randomize_conditions: false
  fixed_positions: false
  width_px: 200
  height_px: 200
  positions:
    - { id: top-left, center_x: 0.2, center_y: 0.3 }
    - { id: top-center, center_x: 0.5, center_y: 0.3 }
    - { id: top-right, center_x: 0.8, center_y: 0.3 }
    - { id: bottom-left, center_x: 0.2, center_y: 0.7 }
    - { id: bottom-center, center_x: 0.5, center_y: 0.7 }
    - { id: bottom-right, center_x: 0.8, center_y: 0.7 }

stimuli:
  - id: freq-8-75
    frequency_hz: 9
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.5
      center_y: 0.5
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-9-75
    frequency_hz: 9.6
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.5
      center_y: 0.5
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-10-75
    frequency_hz: 11
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.5
      center_y: 0.5
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-11-75
    frequency_hz: 12.75
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.5
      center_y: 0.5
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-12-75
    frequency_hz: 14.4
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.5
      center_y: 0.5
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-13-75
    frequency_hz: 15
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.5
      center_y: 0.5
      on_color: "#FFFFFF"
      off_color: "#000000"

presentation:
  window_mode: full_screen
  screen_index: 0
  hide_cursor: false
  refresh_preflight_frames: 120
  require_timing_quality: true
  max_frequency_error_hz: 0.25
  max_dropped_frame_fraction: 0.02
  psychopy:
    monitor_name: SSVEP_144Hz
    gamma: 2.169
    refresh_rate_hz: 144.0
    use_retina: false
    allow_gui: false
    check_timing: true
    units: pix
    message_color: "#000000"
    message_height_px: 40
    cue_border_color: "#FF3040"
    cue_border_width_px: 8

output:
  root_dir: ../../../../sessions
  flush_every_batch: true
  write_checksums: true

markers:
  session_start: 10
  session_complete: 11
  session_abort: 12
  session_failed: 13
  trial_start: 20
  trial_end: 21
  stimulus_onset_base: 1000
  stimulus_offset_base: 2000

resources: { assets: {} }
