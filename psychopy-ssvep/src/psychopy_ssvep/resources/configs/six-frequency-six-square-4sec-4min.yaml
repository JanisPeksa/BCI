schema_version: 1
experiment_id: six-frequency-six-square-4sec-12blocks
title: Six-Frequency Six-Square Randomized Target Collection
random_seed: 20260729
device_profile: ../devices/synthetic.yaml

# All six squares flash simultaneously, each frequency fixed at its own grid
# position. The attended target cycles randomly through the six frequencies
# (seeded by random_seed), with each frequency appearing exactly once per
# repetition. Eight repetitions yield 48 trials, each frequency attended 8
# times.
protocol:
  active_stimulus_id: freq-9-75
  repetitions: 8
  stimulus_sequence:
    [freq-8-75, freq-9-75, freq-10-75, freq-11-75, freq-12-75, freq-13-75]
  randomize_stimulus_sequence: true
  simultaneous_stimulus_ids:
    [freq-8-75, freq-9-75, freq-10-75, freq-11-75, freq-12-75, freq-13-75]
  acquisition_pre_roll_seconds: 0.0
  initial_rest_seconds: 5.0
  pre_stimulus_seconds: 1.0
  stimulation_seconds: 4.0
  inter_trial_seconds: 3.0
  sequence_break_seconds: 0.0
  final_rest_seconds: 0.0
  acquisition_post_roll_seconds: 0.0

stimuli:
  - id: freq-8-75
    frequency_hz: 9
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.2
      center_y: 0.3
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-9-75
    frequency_hz: 9.6
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.5
      center_y: 0.3
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-10-75
    frequency_hz: 11
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.8
      center_y: 0.3
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-11-75
    frequency_hz: 12.75
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.2
      center_y: 0.7
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-12-75
    frequency_hz: 14.4
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.5
      center_y: 0.7
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-13-75
    frequency_hz: 15
    duty_cycle: 0.5
    waveform: square
    visual:
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.8
      center_y: 0.7
      on_color: "#FFFFFF"
      off_color: "#000000"

presentation:
  window_mode: full_screen
  screen_index: 0
  hide_cursor: false
  show_trial_progress: true
  trial_progress_message: "Trial {current} of {total}"
  refresh_preflight_frames: 120
  require_timing_quality: true
  max_frequency_error_hz: 0.25
  max_dropped_frame_fraction: 0.02
  psychopy:
    monitor_name: SSVEP_144Hz
    gamma: 2.169
    refresh_rate_hz: 144.0
    use_retina: false
    allow_gui: false
    check_timing: true
    units: pix
    message_color: "#000000"
    message_height_px: 40
    cue_border_color: "#FF3040"
    cue_border_width_px: 8

output:
  root_dir: ../../../../sessions
  flush_every_batch: true
  write_checksums: true

markers:
  session_start: 10
  session_complete: 11
  session_abort: 12
  session_failed: 13
  trial_start: 20
  trial_end: 21
  stimulus_onset_base: 1000
  stimulus_offset_base: 2000

resources: { assets: {} }
