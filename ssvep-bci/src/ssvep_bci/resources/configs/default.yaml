schema_version: 1
experiment_id: single-target-smoke
title: Single Target SSVEP Recording
random_seed: 20260723
device_profile: ../devices/synthetic.yaml
protocol:
  active_stimulus_id: target-1
  repetitions: 2
  acquisition_pre_roll_seconds: 1.0
  initial_rest_seconds: 1.0
  pre_stimulus_seconds: 1.0
  stimulation_seconds: 5.0
  inter_trial_seconds: 1.0
  final_rest_seconds: 1.0
  acquisition_post_roll_seconds: 1.0
stimuli:
  - id: target-1
    frequency_hz: 12.75
    phase_offset_radians: 0.0
    duty_cycle: 0.5
    visual:
      shape: circle
      width_px: 240
      height_px: 240
      center_x: 0.5
      center_y: 0.5
      on_color: "#FFFFFF"
      off_color: "#000000"
presentation:
  window_mode: full_screen
  screen_index: 0
  background_color: "#000000"
  theme: forced_dark
  hide_cursor: true
  refresh_preflight_frames: 120
  require_timing_quality: true
  max_frequency_error_hz: 0.25
  max_dropped_frame_fraction: 0.02
output:
  root_dir: ../../../../sessions
  flush_every_batch: true
  write_checksums: true
processing:
  enabled: false
  required: false
  processor: fbcca
  transport: worker_thread
  channels: [O1, O2, Oz, PO3, PO4, P3, P4, Pz]
  candidate_frequencies_hz: [8.25, 8.75, 9.75, 10.75, 11.75, 12.75, 13.75, 14.25]
  window: {onset_offset_seconds: 0.25, length_seconds: 4.5, wait_timeout_seconds: 2.0}
  notch: {enabled: true, frequency_hz: 60.0, quality_factor: 30.0}
  filter_bank: {preset: legacy_2022, subbands: 10}
  cca: {harmonics: 2, components: 1}
  classifier: {model_path: null, allow_unsafe_legacy_joblib: false}
markers:
  session_start: 10
  session_complete: 11
  session_abort: 12
  session_failed: 13
  trial_start: 20
  trial_end: 21
  stimulus_onset_base: 1000
  stimulus_offset_base: 2000
resources: {assets: {}}
