schema_version: 1
experiment_id: four-frequency-fbtdca-collection
title: Four-Frequency FBTDCA Uncut Two-Second Verification
random_seed: 20260801
device_profile: ../devices/cyton.yaml

# Classify the first 2.0 seconds immediately after confirmed frame-swap onset.
protocol:
  active_stimulus_id: freq-8
  stimulus_sequence: [freq-8, freq-9, freq-13, freq-14]
  randomize_stimulus_sequence: true
  simultaneous_stimulus_ids: [freq-8, freq-9, freq-13, freq-14]
  repetitions: 12
  acquisition_pre_roll_seconds: 0.0
  initial_rest_seconds: 5.0
  pre_stimulus_seconds: 1.0
  stimulation_seconds: 4.0
  inter_trial_seconds: 3.0
  sequence_break_seconds: 0.0
  final_rest_seconds: 10.0
  acquisition_post_roll_seconds: 0.0

stimuli:
  - id: freq-8
    frequency_hz: 8.0
    phase_offset_radians: 0.0
    duty_cycle: 0.5
    visual: &top_left
      shape: rectangle
      width_px: 200
      height_px: 200
      center_x: 0.3
      center_y: 0.3
      on_color: "#FFFFFF"
      off_color: "#000000"
  - id: freq-9
    frequency_hz: 9.0
    phase_offset_radians: 0.0
    duty_cycle: 0.5
    visual:
      <<: *top_left
      center_x: 0.7
  - id: freq-13
    frequency_hz: 13.0
    phase_offset_radians: 0.0
    duty_cycle: 0.5
    visual:
      <<: *top_left
      center_y: 0.7
  - id: freq-14
    frequency_hz: 14.0
    phase_offset_radians: 0.0
    duty_cycle: 0.5
    visual:
      <<: *top_left
      center_x: 0.7
      center_y: 0.7

presentation:
  window_mode: full_screen
  screen_index: 0
  background_color: "#000000"
  theme: forced_dark
  hide_cursor: true
  refresh_preflight_frames: 120
  require_timing_quality: true
  max_frequency_error_hz: 0.25
  max_dropped_frame_fraction: 0.02

output:
  root_dir: ../../../../sessions
  flush_every_batch: true
  write_checksums: true

processing:
  enabled: false
  required: false
  processor: fbcca
  transport: worker_thread
  channels: [O1, O2, Oz, PO3, PO4, P3, P4, Pz]
  candidate_frequencies_hz: [8.0, 9.0, 13.0, 14.0]
  window: {onset_offset_seconds: 0.0, length_seconds: 2.0, wait_timeout_seconds: 2.0}
  notch: {enabled: true, frequency_hz: 60.0, quality_factor: 30.0}
  filter_bank: {preset: legacy_2022, subbands: 10}
  cca: {harmonics: 2, components: 1}
  classifier: {model_path: null, allow_unsafe_legacy_joblib: false}

markers:
  session_start: 10
  session_complete: 11
  session_abort: 12
  session_failed: 13
  trial_start: 20
  trial_end: 21
  stimulus_onset_base: 1000
  stimulus_offset_base: 2000

resources: {assets: {}}
