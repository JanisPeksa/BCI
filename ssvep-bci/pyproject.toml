[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ssvep-bci"
version = "0.1.0"
description = "Modular SSVEP BCI stimulus, acquisition, recording, and processing application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pydantic>=2.8,<3",
    "PySide6>=6.7,<7",
    "PyYAML>=6,<7",
    "scikit-learn>=1.4,<2",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
acquisition = [
    "brainflow>=5.16,<6",
    "pylsl>=1.17,<2",
    "pyserial>=3.5,<4",
]
analysis = [
    "ipykernel>=6.29,<7",
    "jupyter>=1.1,<2",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<4",
]
fbtdca = [
    "brainda @ git+https://github.com/TBC-TJU/brainda.git@b46a33bcf3cb3625d09571fdeac8c8bc0480db69",
]
training = [
    "brainda @ git+https://github.com/TBC-TJU/brainda.git@b46a33bcf3cb3625d09571fdeac8c8bc0480db69",
    "ipykernel>=6.29,<7",
    "jupyter>=1.1,<2",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<4",
]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5"]
all = [
    "brainda @ git+https://github.com/TBC-TJU/brainda.git@b46a33bcf3cb3625d09571fdeac8c8bc0480db69",
    "brainflow>=5.16,<6",
    "ipykernel>=6.29,<7",
    "jupyter>=1.1,<2",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<4",
    "pylsl>=1.17,<2",
    "pyserial>=3.5,<4",
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
ssvep-bci = "ssvep_bci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssvep_bci = ["resources/**/*.yaml", "resources/**/*.ttf"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
