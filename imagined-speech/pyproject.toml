[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "imagined-speech"
version = "0.1.0"
description = "Configurable imagined-speech EEG experiment platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
ui = ["PyQt6>=6.7,<7"]
acquisition = [
    "brainflow>=5.16,<6",
    "numpy>=1.26,<3",
    "pylsl>=1.17,<2",
    "scipy>=1.13,<2",
]
dev = ["pytest>=8,<9"]
all = [
    "brainflow>=5.16,<6",
    "numpy>=1.26,<3",
    "pylsl>=1.17,<2",
    "PyQt6>=6.7,<7",
    "scipy>=1.13,<2",
]

[project.scripts]
imagined-speech = "imagined_speech.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["imagined_speech*"]

[tool.setuptools.package-data]
imagined_speech = ["resources/**/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
