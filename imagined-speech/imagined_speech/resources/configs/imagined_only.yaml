schema_version: 1
experiment_id: feis_phoneme_imagined_only
title: FEIS-Style Phoneme Benchmark — Imagined Only
profile: imagined_only
random_seed: 20260715
device_profile: ../devices/synthetic.yaml
protocol:
  blocks: 4
  repetitions_per_stimulus: 10
  practice_stimulus_ids: [p, s, i, u]
  practice_repetitions_per_stimulus: 1
  initial_rest_seconds: 60
  final_rest_seconds: 60
  inter_block_break_seconds: 60
phases:
  rest: {duration_seconds: 5, instruction: REST}
  stimulus: {duration_seconds: 5, instruction: Observe or listen to the phoneme}
  thinking: {duration_seconds: 5, instruction: Imagine repeating the phoneme five times}
  pause: {duration_seconds: 5, instruction: PAUSE}
stimuli:
  - {id: p, label: /p/}
  - {id: t, label: /t/}
  - {id: k, label: /k/}
  - {id: f, label: /f/}
  - {id: s, label: /s/}
  - {id: sh, label: /ʃ/}
  - {id: v, label: /v/}
  - {id: z, label: /z/}
  - {id: zh, label: /ʒ/}
  - {id: m, label: /m/}
  - {id: n, label: /n/}
  - {id: ng, label: /ŋ/}
  - {id: i, label: /i/}
  - {id: u, label: /u/}
  - {id: ae, label: /æ/}
  - {id: open_o, label: /ɔ/}
presentation:
  window_mode: FULL_SCREEN
  subject_screen: 1
  show_countdown: true
  show_progress: true
  audio: {enabled: false, volume: 0.8, require_all_stimuli: false}
qc: {enabled: false, line_frequency_hz: 50}
output: {root_dir: ../../../sessions}
