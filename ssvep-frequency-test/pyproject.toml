[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssvep-photosensor-check"
version = "0.3.0"
description = "Independent photosensor frequency validation for SSVEP session folders"
requires-python = ">=3.11"
dependencies = [
    "pyserial==3.5",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
notebook = [
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
    "nbformat==5.10.4",
    "ipykernel==7.3.0",
]
dev = ["pytest>=8,<9"]

[project.scripts]
record-photosensor = "record_photosensor:main"
run-photosensor-check = "run_check:main"
ssvep-frequency-validation = "frequency_validation:main"

[tool.setuptools]
packages = ["photosensor_check"]
py-modules = ["frequency_validation", "record_photosensor", "run_check"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
