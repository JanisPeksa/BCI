schema_version: 2
experiment_id: imagined_speech_brainflow_smoke
title: Imagined Speech BrainFlow Smoke Test
profile: imagined_only
random_seed: 1001
device_profile: ../devices/brainflow_synthetic.yaml
protocol:
  blocks: 1
  repetitions_per_stimulus: 1
  practice_stimulus_ids: [p]
  practice_repetitions_per_stimulus: 1
  initial_rest_seconds: 1
  final_rest_seconds: 1
  inter_block_break_seconds: 0
phases:
  rest: {duration_seconds: 1, instruction: REST}
  stimulus: {duration_seconds: 1, instruction: Observe the phoneme}
  thinking: {duration_seconds: 1, instruction: Imagine repeating the phoneme}
  pause: {duration_seconds: 1, instruction: PAUSE}
stimuli:
  - {id: p, label: /p/}
  - {id: i, label: /i/}
presentation:
  show_countdown: true
  show_progress: true
  audio: {enabled: false, volume: 0.8, require_all_stimuli: false}
  psychopy:
    monitor_name: testMonitor
    gamma: 1.0
    refresh_rate_hz: 60
    screen_index: 0
    window_mode: CENTER
    window_size_px: [1000, 700]
    hide_cursor: false
    use_retina: true
    check_timing: true
    wait_blanking: true
    text: {font: Arial, headline_height_px: 80, instruction_height_px: 30, progress_height_px: 22, countdown_height_px: 34, primary_color: "#f5f7fa", muted_color: "#aeb6c4", accent_color: "#9dc1ff"}
    assets: {max_width_px: 900, max_height_px: 500, interpolate: true}
    preflight_warmup_frames: 10
    preflight_frame_count: 120
    refresh_rate_tolerance_hz: 0.5
    max_frame_interval_factor: 1.5
    max_dropped_frame_fraction: 0.01
    max_ipc_rtt_ms: 25
    frame_ack_timeout_seconds: 2
    require_timing_quality: false
    audio_backend: ptb
    audio_latency_mode: 3
qc: {enabled: false, line_frequency_hz: 50}
output: {root_dir: ../../../../sessions}
